<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CV Celestial — Dashboard</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:          #0a0f14;
    --bg2:         #070b0f;
    --surface:     #0f1620;
    --card:        #141d28;
    --card-hi:     #1c2a3860;
    --border:      #21303c;
    --border-soft: #18242f;
    --accent:      #22d3ee;   /* cyan — detección */
    --accent2:     #a3e635;   /* lima neón — confianza */
    --blue:        #2dd4bf;   /* teal — variante */
    --green:       #4ade80;
    --yellow:      #fbbf24;
    --pink:        #f472b6;
    --red:         #f87171;
    --text:        #dbe7ec;
    --text-mut:    #7d93a0;
    --text-dim:    #54677a;
    --radius:      14px;
    --radius-sm:   9px;
    --font:        'Segoe UI', system-ui, -apple-system, sans-serif;
    --mono:        ui-monospace, 'Cascadia Code', 'Consolas', monospace;
    --shadow:      0 8px 28px -12px rgba(0,0,0,0.7);
  }

  html { scroll-behavior: smooth; }
  body {
    background:
      radial-gradient(1100px 600px at 12% -8%, rgba(34,211,238,0.10), transparent 60%),
      radial-gradient(900px 520px at 100% 0%, rgba(163,230,53,0.07), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 14.5px;
    line-height: 1.6;
    min-height: 100vh;
    padding-bottom: 70px;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; }

  /* ─── Header ─── */
  .hdr {
    position: relative;
    padding: 30px 46px 26px;
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 18px;
    background: linear-gradient(180deg, rgba(26,30,53,0.5), transparent);
  }
  .hdr-brand { display: flex; align-items: center; gap: 16px; }
  .hdr-logo {
    width: 46px; height: 46px; border-radius: 13px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: grid; place-items: center;
    font-weight: 800; font-size: 19px; color: #fff;
    box-shadow: 0 6px 18px -6px rgba(34,211,238,0.7);
  }
  .hdr h1 { font-size: 23px; font-weight: 700; color: #fff; letter-spacing: -0.3px; }
  .hdr h1 span { color: var(--accent); }
  .hdr-sub { color: var(--text-mut); font-size: 12.5px; margin-top: 1px; }
  .hdr-actions { display: flex; align-items: center; gap: 10px; }
  .pill {
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.9px;
    color: #cdd6f4; background: rgba(34,211,238,0.14);
    border: 1px solid rgba(34,211,238,0.3);
    padding: 6px 13px; border-radius: 30px;
  }
  .btn-classic {
    font-size: 12.5px; font-weight: 600; color: var(--text);
    text-decoration: none; padding: 8px 16px; border-radius: 9px;
    border: 1px solid var(--border); background: var(--card);
    transition: all .15s; display: inline-flex; align-items: center; gap: 7px;
  }
  .btn-classic:hover { border-color: var(--accent); color: #fff; background: var(--card-hi); }

  /* ─── Sub nav ─── */
  .subnav {
    position: sticky; top: 0; z-index: 50;
    background: rgba(10,12,22,0.92); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    display: flex; gap: 4px; padding: 0 46px; overflow-x: auto; scrollbar-width: none;
  }
  .subnav::-webkit-scrollbar { display: none; }
  .subnav a {
    padding: 13px 15px; font-size: 12.5px; font-weight: 500; color: var(--text-mut);
    text-decoration: none; white-space: nowrap; border-bottom: 2px solid transparent;
    transition: color .15s, border-color .15s;
  }
  .subnav a:hover { color: var(--text); }
  .subnav a.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* ─── Layout ─── */
  .wrap { max-width: 1240px; margin: 0 auto; padding: 30px 46px; }
  .block { margin-bottom: 46px; scroll-margin-top: 64px; }
  .block-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 18px; }
  .block-num {
    font-size: 11px; font-weight: 800; letter-spacing: 1.5px; color: var(--accent);
    background: rgba(34,211,238,0.12); padding: 3px 9px; border-radius: 6px;
  }
  .block-title { font-size: 17px; font-weight: 700; color: #fff; letter-spacing: -0.2px; }
  .block-desc { color: var(--text-mut); font-size: 12.5px; margin-left: auto; }

  /* ─── Cards / grids ─── */
  .card {
    background: linear-gradient(180deg, var(--card), var(--surface));
    border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .kpi-grid {
    display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fit, minmax(168px, 1fr));
  }
  .kpi {
    background: linear-gradient(180deg, var(--card), var(--surface));
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px 18px 16px; position: relative; overflow: hidden;
    transition: transform .15s, border-color .15s;
  }
  .kpi:hover { transform: translateY(-3px); border-color: rgba(34,211,238,0.45); }
  /* esquina de bounding-box (motivo CV) */
  .kpi::before {
    content:''; position:absolute; left:9px; bottom:9px; width:13px; height:13px;
    border-left: 2px solid var(--accent); border-bottom: 2px solid var(--accent);
    border-bottom-left-radius: 3px; opacity: .42;
  }
  .kpi::after {
    content: ''; position: absolute; inset: 0 0 auto auto;
    width: 70px; height: 70px; border-radius: 50%;
    background: radial-gradient(circle, var(--kc, var(--accent)), transparent 70%);
    opacity: .13; transform: translate(24px, -24px);
  }
  .kpi-ico {
    width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center;
    font-size: 17px; background: var(--kbg, rgba(34,211,238,0.13));
    border: 1px solid var(--kbd, rgba(34,211,238,0.28)); margin-bottom: 12px;
  }
  .kpi-val { font-family: var(--mono); font-size: 29px; font-weight: 700; color: #fff; line-height: 1; letter-spacing: -1px; }
  .kpi-val small { font-size: 15px; font-weight: 700; color: var(--text-mut); }
  .kpi-lbl { font-size: 12px; color: var(--text-mut); margin-top: 7px; font-weight: 500; }

  /* progress ring (overall) */
  .overall {
    display: flex; align-items: center; gap: 26px; padding: 22px 26px;
    flex-wrap: wrap;
  }
  .ring { position: relative; width: 132px; height: 132px; flex-shrink: 0; }
  .ring svg { transform: rotate(-90deg); }
  .ring-label {
    position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
  }
  .ring-label b { font-family: var(--mono); font-size: 29px; font-weight: 700; color: #fff; letter-spacing: -1px; }
  .ring-label span { display: block; font-size: 10.5px; color: var(--text-mut); letter-spacing: 1px; text-transform: uppercase; }
  .overall-stats { display: flex; flex-wrap: wrap; gap: 26px 40px; flex: 1; }
  .ostat b { font-family: var(--mono); font-size: 21px; font-weight: 700; color: #fff; display: block; line-height: 1.1; }
  .ostat span { font-size: 12px; color: var(--text-mut); }
  .ostat i { font-style: normal; }

  /* ─── Project cards ─── */
  .proj-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); }
  .proj {
    background: linear-gradient(180deg, var(--card), var(--surface));
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px; display: flex; flex-direction: column; gap: 13px;
    transition: transform .15s, border-color .15s;
  }
  .proj:hover { transform: translateY(-3px); border-color: rgba(34,211,238,0.4); }
  .proj-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .proj-name { font-size: 15.5px; font-weight: 700; color: #fff; }
  .proj-meta { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; }
  .badge {
    font-size: 10.5px; font-weight: 700; padding: 4px 9px; border-radius: 20px;
    white-space: nowrap; text-transform: uppercase; letter-spacing: 0.4px;
  }
  .b-dev      { color: var(--accent); background: rgba(34,211,238,0.13);  border: 1px solid rgba(34,211,238,0.3); }
  .b-prod     { color: var(--green);  background: rgba(52,211,153,0.14);  border: 1px solid rgba(52,211,153,0.3); }
  .b-paused   { color: var(--yellow); background: rgba(251,191,36,0.14);  border: 1px solid rgba(251,191,36,0.3); }
  .b-research { color: var(--blue);   background: rgba(45,212,191,0.14);  border: 1px solid rgba(45,212,191,0.3); }
  .b-archived { color: var(--text-mut);background: rgba(136,146,176,0.12);border: 1px solid rgba(136,146,176,0.25); }

  .pbar { height: 8px; border-radius: 6px; background: rgba(255,255,255,0.06); overflow: hidden; }
  .pbar-fill { height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .6s ease; }
  .pbar-fill.done { background: linear-gradient(90deg, #2dd4a7, var(--green)); }
  .proj-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; }
  .proj-row .muted { color: var(--text-mut); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 10.5px; font-weight: 600; padding: 3px 9px; border-radius: 7px;
    background: rgba(255,255,255,0.05); border: 1px solid var(--border); display: inline-flex; gap: 5px; align-items: center;
  }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; }

  /* ─── Timeline / gantt ─── */
  .tl-wrap { padding: 18px 20px 20px; overflow-x: auto; }
  .tl-head { display: flex; margin-left: var(--lbl-w, 168px); position: relative; height: 24px; margin-bottom: 6px; }
  .tl-tick {
    flex: 1; font-size: 10.5px; color: var(--text-dim); text-align: center;
    border-left: 1px solid var(--border-soft); padding-left: 4px;
  }
  .tl-row { display: flex; align-items: center; min-height: 38px; }
  .tl-lbl {
    width: var(--lbl-w, 168px); flex-shrink: 0; padding-right: 14px; font-size: 12.5px;
    color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tl-lbl b { color: #fff; font-weight: 600; }
  .tl-lbl small { color: var(--text-dim); font-size: 10.5px; display: block; }
  .tl-track {
    position: relative; flex: 1; height: 38px;
    background: repeating-linear-gradient(90deg, transparent, transparent calc(10% - 1px), var(--border-soft) calc(10% - 1px), var(--border-soft) 10%);
  }
  .tl-bar {
    position: absolute; top: 8px; height: 22px; border-radius: 7px;
    display: flex; align-items: center; padding: 0 9px; font-size: 11px; font-weight: 600;
    color: #fff; white-space: nowrap; overflow: hidden;
    box-shadow: 0 3px 10px -4px rgba(0,0,0,0.5); cursor: default;
  }
  .tl-bar small { opacity: .85; font-weight: 500; margin-left: 6px; }
  .tl-today {
    position: absolute; top: -4px; bottom: 0; width: 2px; background: var(--red); z-index: 4;
  }
  .tl-today::after {
    content: 'hoy'; position: absolute; top: -16px; left: 50%; transform: translateX(-50%);
    font-size: 9px; color: var(--red); font-weight: 700;
  }

  /* banda de proyecto en el timeline */
  .tl-proj {
    display: flex; align-items: center; gap: 9px;
    margin: 16px 0 7px; padding: 6px 12px;
    border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0;
    font-size: 12.5px; font-weight: 700; color: #fff;
  }
  .tl-proj:first-of-type { margin-top: 4px; }
  .tl-proj .dot { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; }
  .tl-proj-meta { font-weight: 500; color: var(--text-mut); font-size: 11px; }
  .tl-tag { font-size: 9px; font-weight: 700; padding: 1px 6px; border-radius: 5px; margin-left: 7px; white-space: nowrap; }
  .tl-tag.blk { color: var(--red); background: rgba(248,113,113,0.12); border: 1px solid rgba(248,113,113,0.3); }
  .tl-tag.pau { color: var(--yellow); background: rgba(251,191,36,0.12); border: 1px solid rgba(251,191,36,0.3); }
  .tl-bar.blocked { color: var(--text); }

  /* ─── Bloque por proyecto (roadmap + tareas) ─── */
  .pdetail { margin-bottom: 30px; }
  .pdetail-head {
    display: flex; align-items: center; gap: 11px;
    font-size: 16px; font-weight: 700; color: #fff;
    padding-bottom: 11px; margin-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .pdetail-head .dot { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
  .pdetail-head .meta { margin-left: auto; font-size: 11.5px; color: var(--text-mut); font-weight: 600; font-family: var(--mono); }
  .pdetail-sub {
    font-size: 10.5px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase;
    color: var(--text-mut); margin: 16px 0 9px;
  }

  /* ─── Sprint board ─── */
  .sboard { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .scol {
    background: linear-gradient(180deg, var(--card), var(--surface));
    border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden;
    display: flex; flex-direction: column;
  }
  .scol.current { border-color: rgba(34,211,238,0.5); box-shadow: 0 0 0 1px rgba(34,211,238,0.25), var(--shadow); }
  .scol-head { padding: 13px 15px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .scol-name { font-weight: 700; color: #fff; font-size: 14px; }
  .scol-name .now { font-size: 9.5px; color: var(--accent); font-weight: 700; margin-left: 7px; letter-spacing: 1px; }
  .scol-date { font-size: 11px; color: var(--text-mut); margin-top: 1px; }
  .scol-count { font-size: 11px; color: var(--text-mut); }
  .scol-body { padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 60px; }
  .stask {
    background: rgba(255,255,255,0.03); border: 1px solid var(--border-soft); border-radius: 8px;
    padding: 9px 11px; font-size: 12px;
  }
  .stask.done { opacity: .55; }
  .stask.done .stask-txt { text-decoration: line-through; }
  .stask-txt { color: var(--text); line-height: 1.4; }
  .stask-meta { display: flex; align-items: center; gap: 7px; margin-top: 6px; flex-wrap: wrap; }
  .area-tag { font-size: 9.5px; font-weight: 700; padding: 2px 7px; border-radius: 5px; letter-spacing: 0.3px; }
  .stask-resp { font-size: 10.5px; color: var(--text-dim); }
  .scol-empty { color: var(--text-dim); font-size: 11.5px; text-align: center; padding: 16px 0; font-style: italic; }

  /* ─── Tareas por semana (portado de la plataforma) ─── */
  .wk-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); }
  .wk-card {
    background: linear-gradient(180deg, var(--card), var(--surface));
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; display: flex; flex-direction: column; gap: 10px;
  }
  .wk-card.current { border-color: rgba(34,211,238,0.45); box-shadow: 0 0 0 1px rgba(34,211,238,0.2), var(--shadow); }
  .wk-header { display: flex; align-items: baseline; gap: 8px; }
  .wk-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-mut); }
  .wk-label.cur { color: var(--accent); }
  .wk-total-bar { display: flex; justify-content: flex-end; padding-bottom: 7px; border-bottom: 1px solid var(--border-soft); margin-bottom: 2px; }
  .wk-total-badge { font-size: 10.5px; font-weight: 700; color: var(--accent); background: rgba(34,211,238,0.12); padding: 2px 10px; border-radius: 10px; font-family: var(--mono); }
  .wk-group { margin-top: 2px; }
  .wk-person-header { display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; padding: 4px 5px; border-radius: 6px; }
  .wk-person-header:hover { background: rgba(255,255,255,0.05); }
  .wk-chevron { font-size: 11px; color: var(--text-mut); margin-right: 6px; transition: transform .15s; line-height: 1; }
  .wk-group-title { font-size: 12px; font-weight: 700; color: var(--text); }
  .wk-person-count { font-size: 10px; background: rgba(255,255,255,0.06); color: var(--text-mut); padding: 1px 8px; border-radius: 10px; flex-shrink: 0; font-family: var(--mono); }
  .wk-task { display: flex; align-items: flex-start; gap: 8px; padding: 5px 6px 5px 10px; font-size: 12px; color: var(--text); border-radius: 6px; }
  .wk-task:hover { background: rgba(255,255,255,0.025); }
  .wk-bullet { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
  .wk-phase { font-size: 9.5px; color: var(--text-dim); margin-top: 2px; }
  .wk-empty { font-size: 11.5px; color: var(--text-dim); font-style: italic; padding: 6px 2px; }

  /* ─── Areas distribution ─── */
  .twocol { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }
  @media (max-width: 860px) { .twocol { grid-template-columns: 1fr; } }
  .panel { padding: 18px 20px; }
  .panel-h { font-size: 13px; font-weight: 700; color: #fff; margin-bottom: 16px; }
  .barlist { display: flex; flex-direction: column; gap: 12px; }
  .barrow { display: grid; grid-template-columns: 88px 1fr 38px; align-items: center; gap: 10px; }
  .barrow .name { font-size: 12px; color: var(--text); display: flex; align-items: center; gap: 7px; }
  .barrow .name .dot { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; }
  .bartrack { height: 9px; border-radius: 5px; background: rgba(255,255,255,0.05); overflow: hidden; }
  .barfill { height: 100%; border-radius: 5px; transition: width .6s ease; }
  .barrow .num { font-size: 12px; color: var(--text-mut); text-align: right; font-weight: 600; }

  /* acuerdos */
  .ac-stat { display: flex; flex-wrap: wrap; gap: 10px; }
  .acbox {
    flex: 1; min-width: 120px; padding: 14px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: rgba(255,255,255,0.02);
  }
  .acbox b { font-family: var(--mono); font-size: 23px; font-weight: 700; color: #fff; display: block; line-height: 1; }
  .acbox span { font-size: 11px; color: var(--text-mut); display: flex; align-items: center; gap: 6px; margin-top: 7px; }
  .acbox span .dot { width: 8px; height: 8px; border-radius: 50%; }

  /* org */
  .org-card { padding: 22px 14px 16px; overflow-x: auto; }

  /* empty */
  .empty {
    padding: 40px 20px; text-align: center; color: var(--text-dim);
    border: 1px dashed var(--border); border-radius: var(--radius); font-size: 13px;
  }
  .empty b { color: var(--text-mut); display: block; margin-bottom: 4px; font-size: 14px; }
  .empty code {
    background: rgba(255,255,255,0.06); padding: 2px 7px; border-radius: 5px;
    font-size: 12px; color: var(--accent); font-family: ui-monospace, monospace;
  }

  .loading { text-align: center; padding: 60px 0; color: var(--text-mut); }
  .spinner {
    width: 34px; height: 34px; border-radius: 50%; margin: 0 auto 14px;
    border: 3px solid var(--border); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .foot { text-align: center; color: var(--text-dim); font-size: 11.5px; padding: 20px; }
</style>
</head>
<body>

  <header class="hdr">
    <div class="hdr-brand">
      <div class="hdr-logo">CV</div>
      <div>
        <h1>CV <span>Celestial</span> · Dashboard</h1>
        <div class="hdr-sub">Computer Vision · Celestial Dynamics AI — vista ejecutiva</div>
      </div>
    </div>
    <div class="hdr-actions">
      <span class="pill" id="last-update">—</span>
      <a class="btn-classic" href="/app.html">⟵ Abrir app (editable)</a>
    </div>
  </header>

  <nav class="subnav" id="subnav">
    <a href="#b-resumen" class="active">Resumen</a>
    <a href="#b-proyectos">Proyectos</a>
    <a href="#b-roadmap">Roadmap</a>
    <a href="#b-weekly">Tareas por semana</a>
    <a href="#b-areas">Áreas &amp; Acuerdos</a>
    <a href="#b-equipo">Equipo</a>
  </nav>

  <div id="root" class="wrap">
    <div class="loading">
      <div class="spinner"></div>
      Cargando datos del equipo…
    </div>
  </div>

  <div class="foot">
    Dashboard de solo lectura · generado desde los mismos datos de la plataforma · <span id="foot-stamp"></span>
  </div>

<script>
// ═══════════════════════════════════════════════════════════════════════
//  CV Celestial — Dashboard (solo lectura)
//  Consume los mismos endpoints /api/* que index.html. No escribe nada.
// ═══════════════════════════════════════════════════════════════════════

const SPRINTS = [
  { name:'S3',  start:'2026-04-20', end:'2026-04-25' },
  { name:'S4',  start:'2026-04-28', end:'2026-05-02' },
  { name:'S5',  start:'2026-05-05', end:'2026-05-09' },
  { name:'S6',  start:'2026-05-12', end:'2026-05-16' },
  { name:'S7',  start:'2026-05-19', end:'2026-05-23' },
  { name:'S8',  start:'2026-05-26', end:'2026-05-30' },
  { name:'S9',  start:'2026-06-02', end:'2026-06-06' },
  { name:'S10', start:'2026-06-09', end:'2026-06-13' },
  { name:'S11', start:'2026-06-16', end:'2026-06-20' },
  { name:'S12', start:'2026-06-23', end:'2026-06-27' },
];
const DOMAIN_START = SPRINTS[0].start;
const DOMAIN_END   = SPRINTS[SPRINTS.length - 1].end;

const AREA_COLORS = {
  'PM':       '#22d3ee',  // cyan
  'Infra':    '#2dd4bf',  // teal
  'AI Eng':   '#a3e635',  // lima
  'Datos':    '#4ade80',  // verde
  'Frontend': '#fbbf24',  // ámbar
  'Ciclo':    '#f472b6',  // magenta
  'QA':       '#f87171',  // rojo
};
const areaColor = a => AREA_COLORS[a] || '#8892b0';

// color distintivo por proyecto (para dividir roadmap y sprint board)
const PROJ_PALETTE = ['#22d3ee', '#a3e635', '#2dd4bf', '#f472b6', '#fbbf24', '#60a5fa', '#34d399'];
const projColor = i => PROJ_PALETTE[i % PROJ_PALETTE.length];

const PROJ_STATUS = {
  dev:        { label:'En desarrollo', cls:'b-dev' },
  production: { label:'En producción', cls:'b-prod' },
  paused:     { label:'En pausa',      cls:'b-paused' },
  research:   { label:'Investigación', cls:'b-research' },
  archived:   { label:'Archivado',     cls:'b-archived' },
};
const PHASE_COLORS = {
  done:'#4ade80', active:'#22d3ee', paused:'#fbbf24', continuous:'#a3e635',
};
const PLAN_FRIENDLY = { arconte:'Arconte', publicvector:'PublicVector', stack_modelos:'Stack de Modelos', arconte_retail:'Arconte Retail' };

// ── helpers de fecha ──────────────────────────────────────────────────
const TODAY = new Date().toISOString().slice(0, 10);
function dayNum(iso) { return Math.floor(new Date(iso + 'T12:00:00').getTime() / 86400000); }
function pctOfDomain(iso) {
  const a = dayNum(DOMAIN_START), b = dayNum(DOMAIN_END), x = dayNum(iso);
  return Math.max(0, Math.min(100, ((x - a) / (b - a)) * 100));
}
function fmtRange(s, e) {
  const M = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  if (!s) return '';
  const sd = new Date(s + 'T12:00:00');
  if (!e) return `${sd.getDate()} ${M[sd.getMonth()]}`;
  const ed = new Date(e + 'T12:00:00');
  return sd.getMonth() === ed.getMonth()
    ? `${sd.getDate()}–${ed.getDate()} ${M[ed.getMonth()]}`
    : `${sd.getDate()} ${M[sd.getMonth()]} – ${ed.getDate()} ${M[ed.getMonth()]}`;
}
function sprintForDate(iso) {
  for (const s of SPRINTS) if (iso >= s.start && iso <= s.end) return s.name;
  for (const s of SPRINTS) if (iso < s.start) return s.name;
  return SPRINTS[SPRINTS.length - 1].name;
}
function currentSprint() {
  let i = SPRINTS.findIndex(s => TODAY >= s.start && TODAY <= s.end);
  if (i < 0) i = SPRINTS.findIndex(s => TODAY < s.start);
  if (i < 0) i = SPRINTS.length - 1;
  return i;
}
function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── estado global ─────────────────────────────────────────────────────
let DATA = { roadmap:{}, projects:{}, estado:{tasks:{}}, votes:{proposals:[]} };

async function getJSON(url) {
  try { const r = await fetch(url); if (!r.ok) return null; return await r.json(); }
  catch { return null; }
}

async function loadAll() {
  const [rm, pr, es, vo] = await Promise.all([
    getJSON('/api/roadmap'), getJSON('/api/projects'),
    getJSON('/api/estado'), getJSON('/api/votes'),
  ]);
  DATA.roadmap  = rm || {};
  DATA.projects = pr || {};
  DATA.estado   = es || { tasks:{} };
  DATA.votes    = vo || { proposals:[] };
}

// ── normalización: lista unificada de "proyectos" con fases y tareas ──
// Cada proyecto: { id, title, status, phases:[{title,status,start,end,tasks:[{desc,area,resp,done}]}], sprintTasks:[{...,sprint}], acuerdos:[] }
function buildModel() {
  const estado = DATA.estado.tasks || {};
  const out = [];

  // Arconte Retail desde roadmap.json (fuente xlsx)
  const retail = DATA.roadmap.arconte_retail;
  if (retail && (retail.phases || []).length) {
    const phases = (retail.phases || []).filter(p => !p.deleted).map(p => ({
      title: p.title, status: p.status, start: p.start_iso, end: p.end_iso,
      depends_on: [], blocked: false,
      tasks: (p.tasks || []).filter(t => !t.deleted).map(t => {
        const key = 'retail_' + t.id;
        const done = key in estado ? !!estado[key] : !!t.done_xlsx;
        return { desc: t.description, area: t.area, resp: t.responsible, done };
      }),
    }));
    out.push({ id:'arconte_retail', title:'Arconte Retail', status:'dev', source:'roadmap', phases, sprintTasks: [], acuerdos: retail.acuerdos || [] });
  }

  // Proyectos desde projects.json (incluye los _static: ahí vive el roadmap real)
  for (const [pid, p] of Object.entries(DATA.projects || {})) {
    if (!p) continue;
    if (pid === 'arconte_retail' && out.some(o => o.id === 'arconte_retail')) {
      // ya cargado desde roadmap; usar projects.json solo si roadmap vacío
    }
    const phases = (p.phases || []).filter(ph => !ph.deleted).map(ph => ({
      id: ph.id, title: ph.title, status: ph.status, start: ph.start_iso, end: ph.end_iso,
      depends_on: ph.depends_on || [],
      tasks: (ph.tasks || []).filter(t => !t.deleted).map(t => {
        const key = `${pid}_${t.id}`;
        const done = key in estado ? !!estado[key] : !!(t.done ?? t.done_xlsx);
        return { desc: t.description || t.title, area: t.area, resp: t.responsible || t.resp, done, status: t.status || '' };
      }),
    }));
    // Bloqueo por dependencias (igual que la app: una fase con depends_on cuya
    // dependencia no está completa queda bloqueada → se oculta en "Tareas por semana").
    const phComplete = {};
    phases.forEach(ph => { phComplete[ph.id] = ph.tasks.length > 0 && ph.tasks.every(t => t.done); });
    phases.forEach(ph => { ph.blocked = (ph.depends_on || []).some(dep => !phComplete[dep]); });
    const sprintTasks = [];
    for (const [sp, arr] of Object.entries(p.sprint_tasks || {})) {
      (arr || []).filter(t => !t.deleted).forEach(t => sprintTasks.push({
        desc: t.title || t.description, area: t.area, resp: t.resp || t.responsible, done: !!t.done, sprint: sp,
      }));
    }
    const existing = out.find(o => o.id === pid);
    if (existing) { existing.sprintTasks.push(...sprintTasks); continue; }
    out.push({
      id: pid, title: p.title || PLAN_FRIENDLY[pid] || pid,
      status: p.status || p.meta?.status || 'dev', source:'projects',
      phases, sprintTasks, acuerdos: p.acuerdos || [],
    });
  }
  return out;
}

function projStats(p) {
  let total = 0, done = 0;
  p.phases.forEach(ph => ph.tasks.forEach(t => { total++; if (t.done) done++; }));
  p.sprintTasks.forEach(t => { total++; if (t.done) done++; });
  return { total, done, pct: total ? Math.round(done / total * 100) : 0 };
}

// ════════════════════════ RENDER ═══════════════════════════════════════
function render() {
  const model = buildModel();
  const root = document.getElementById('root');
  root.innerHTML =
    renderResumen(model) +
    renderProyectos(model) +
    renderRoadmap(model) +
    renderWeekly(model) +
    renderAreasAcuerdos(model) +
    renderEquipo();

  document.getElementById('last-update').textContent =
    'Actualizado ' + new Date().toLocaleString('es-MX', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
  document.getElementById('foot-stamp').textContent = new Date().toLocaleString('es-MX');
  initNavSpy();
}

// ── 01 Resumen / KPIs ─────────────────────────────────────────────────
function renderResumen(model) {
  let total = 0, done = 0, activePhases = 0, donePhases = 0;
  model.forEach(p => {
    const s = projStats(p); total += s.total; done += s.done;
    p.phases.forEach(ph => {
      const allDone = ph.tasks.length && ph.tasks.every(t => t.done);
      if (allDone || ph.status === 'done') donePhases++;
      else if (ph.status !== 'paused') activePhases++;
    });
  });
  const pct = total ? Math.round(done / total * 100) : 0;
  const csIdx = currentSprint();
  const cs = SPRINTS[csIdx];

  let acTotal = 0, acDone = 0;
  model.forEach(p => (p.acuerdos || []).forEach(a => (a.items || []).forEach(it => {
    acTotal++; if ((it.status || '').toUpperCase() === 'COMPLETADO') acDone++;
  })));

  // ring
  const R = 56, C = 2 * Math.PI * R;
  const off = C * (1 - pct / 100);
  const ringColor = pct >= 100 ? 'var(--green)' : 'var(--accent)';

  const kpis = [
    { ico:'📁', val: model.length,        lbl:'Proyectos activos',  c:'var(--accent)',  bg:'rgba(34,211,238,0.13)',  bd:'rgba(34,211,238,0.3)' },
    { ico:'🧩', val: total,               lbl:'Tareas totales',     c:'var(--accent2)', bg:'rgba(163,230,53,0.13)',  bd:'rgba(163,230,53,0.3)' },
    { ico:'✅', val: done,                lbl:'Tareas completadas', c:'var(--green)',   bg:'rgba(74,222,128,0.13)',  bd:'rgba(74,222,128,0.3)' },
    { ico:'⚡', val: activePhases,        lbl:'Fases en curso',     c:'var(--blue)',    bg:'rgba(45,212,191,0.13)',  bd:'rgba(45,212,191,0.3)' },
    { ico:'🗓️', val: cs.name, lbl:'Sprint actual', c:'var(--yellow)', bg:'rgba(251,191,36,0.13)', bd:'rgba(251,191,36,0.3)' },
    { ico:'🤝', val: acTotal, lbl:'Acuerdos registrados', c:'var(--pink)', bg:'rgba(244,114,182,0.13)', bd:'rgba(244,114,182,0.3)' },
  ];

  const kpiHTML = kpis.map(k => `
    <div class="kpi" style="--kc:${k.c}">
      <div class="kpi-ico" style="--kbg:${k.bg};--kbd:${k.bd}">${k.ico}</div>
      <div class="kpi-val">${k.val}</div>
      <div class="kpi-lbl">${k.lbl}</div>
    </div>`).join('');

  const overall = `
    <div class="card overall" style="margin-top:14px">
      <div class="ring">
        <svg width="132" height="132" viewBox="0 0 132 132">
          <circle cx="66" cy="66" r="${R}" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="11"/>
          <circle cx="66" cy="66" r="${R}" fill="none" stroke="${ringColor}" stroke-width="11"
                  stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>
        </svg>
        <div class="ring-label"><div><b>${pct}%</b><span>completado</span></div></div>
      </div>
      <div class="overall-stats">
        <div class="ostat"><b>${done}<i style="color:var(--text-dim);font-weight:600">/${total}</i></b><span>Tareas hechas</span></div>
        <div class="ostat"><b>${donePhases}</b><span>Fases completadas</span></div>
        <div class="ostat"><b>${acDone}<i style="color:var(--text-dim);font-weight:600">/${acTotal}</i></b><span>Acuerdos cerrados</span></div>
        <div class="ostat"><b>${cs.name}</b><span>${fmtRange(cs.start, cs.end)}</span></div>
      </div>
    </div>`;

  return `
  <section class="block" id="b-resumen">
    <div class="block-head">
      <span class="block-num">01</span><span class="block-title">Resumen general</span>
      <span class="block-desc">Estado consolidado del equipo</span>

// ── 02 Proyectos ──────────────────────────────────────────────────────

// ── 03 Roadmap (gantt por proyecto) ───────────────────────────────────
function renderRoadmap(model) {
  const todayLeft = pctOfDomain(TODAY);
  const ticks = SPRINTS.map(s => `<div class="tl-tick">${s.name}</div>`).join('');

  function roadmapRows(p) {
    const rows = [];
    p.phases.forEach(ph => {
      if (!ph.start) return;
      const allDone = ph.tasks.length && ph.tasks.every(t => t.done);
      rows.push({ title: ph.title, start: ph.start, end: ph.end || ph.start,
        status: allDone ? 'done' : ph.status, blocked: !!ph.blocked && !allDone,
        done: ph.tasks.filter(t => t.done).length, total: ph.tasks.length });
    });
    return rows.sort((a, b) => a.start.localeCompare(b.start));
  }
  function roadmapHTML(rows) {
    const bars = rows.map(r => {
      const left = pctOfDomain(r.start);
      const width = Math.max(2.5, pctOfDomain(r.end) - left);
      const col = PHASE_COLORS[r.status] || PHASE_COLORS.active;
      const prog = r.total ? `${r.done}/${r.total}` : '';
      // etiqueta de estado: bloqueada / en pausa (visible en el roadmap)
      const tag = r.blocked ? `<span class="tl-tag blk">⛔ bloqueada</span>`
        : r.status === 'paused' ? `<span class="tl-tag pau">⏸ pausa</span>` : '';
      const barStyle = r.blocked
        ? `background:repeating-linear-gradient(45deg, ${col}55, ${col}55 6px, transparent 6px, transparent 12px);border:1px dashed ${col}aa;`
        : `background:linear-gradient(90deg, ${col}, ${col}cc);`;
      return `
      <div class="tl-row">
        <div class="tl-lbl"><b>${esc(r.title)}</b><small>${fmtRange(r.start, r.end)}${tag}</small></div>
        <div class="tl-track">
          <div class="tl-today" style="left:${todayLeft}%"></div>
          <div class="tl-bar${r.blocked ? ' blocked' : ''}" style="left:${left}%;width:${width}%;${barStyle}"
               title="${esc(r.title)} · ${fmtRange(r.start, r.end)} · ${prog}${r.blocked ? ' · bloqueada por dependencias' : ''}">
            ${esc(r.title)} ${prog ? `<small>${prog}</small>` : ''}
          </div>
        </div>
      </div>`;
    }).join('');
    return `<div class="card tl-wrap"><div class="tl-head">${ticks}</div>${bars}</div>`;
  }

  const blocks = model.map((p, pi) => {
    const rows = roadmapRows(p);
    if (!rows.length) return null;
    const st = projStats(p);
    return `
      <div class="pdetail">
        <div class="pdetail-head">
          <span class="dot" style="background:${projColor(pi)}"></span>${esc(p.title)}
          <span class="meta">${st.pct}% · ${rows.length} fase${rows.length !== 1 ? 's' : ''}</span>
        </div>
        ${roadmapHTML(rows)}
      </div>`;
  }).filter(Boolean).join('');

  const inner = blocks || `<div class="empty"><b>Sin fases con fechas</b>
    Importa el roadmap o crea fases desde la app editable.</div>`;
  const legend = `
    <div style="display:flex;gap:16px;margin:2px 0 18px;flex-wrap:wrap;font-size:11px;color:var(--text-mut)">
      ${Object.entries(PHASE_COLORS).map(([k,c]) =>
        `<span style="display:inline-flex;align-items:center;gap:6px"><span style="width:11px;height:11px;border-radius:3px;background:${c}"></span>${ {done:'Completada',active:'En curso',paused:'En pausa',continuous:'Continuo'}[k] }</span>`).join('')}
    </div>`;

  return `
  <section class="block" id="b-roadmap">
    <div class="block-head">
      <span class="block-num">03</span><span class="block-title">Roadmap por proyecto</span>
      <span class="block-desc">Abr 20 → Jun 27 (S3–S12)</span>
    </div>
    ${legend}
    ${inner}
  </section>`;
}

// ── 04 Tareas por semana (portado fiel de la plataforma) ──────────────
let _wkGid = 0;
function renderWeekly(model) {
  const csIdx = currentSprint();
  const weeks = SPRINTS.slice(csIdx, csIdx + 4);
  if (!weeks.length) weeks.push(SPRINTS[SPRINTS.length - 1]);

  // misma lógica de recolección que "Tareas por semana" de la app:
  //  · fases en pausa fuera · solo tareas cuya fase traslapa la semana
  //  · vencidas pero vigentes se anclan al sprint actual
  function tasksForWeek(sprint) {
    const out = [];
    model.forEach(p => {
      p.phases.forEach(ph => {
        if (!ph.start || ph.status === 'paused') return;  // solo en pausa queda fuera (bloqueadas SÍ se ven)
        const phStart = ph.start;
        // Fecha efectiva: si la fase ya empezó o venció, sus tareas pendientes se
        // anclan a HOY (sprint actual); si es futura, a su semana de inicio. Así una
        // tarea sin hacer de una fase pasada NO desaparece: sigue pendiente hasta cerrarse.
        const effDate = phStart < TODAY ? TODAY : phStart;
        if (sprintForDate(effDate) !== sprint.name) return;
        ph.tasks.forEach(t => out.push({ ...t, project: p.title, phase: ph.title, blocked: !!ph.blocked }));
      });
      p.sprintTasks.forEach(t => { if (t.sprint === sprint.name) out.push({ ...t, project: p.title, phase: '', blocked: false }); });
    });
    return out;
  }

  // Una fila de tarea (reutilizada en activas y en esperando).
  function taskRow(t, waiting) {
    return `
      <div class="wk-task">
        <span class="wk-bullet" style="background:${areaColor(t.area)}"></span>
        <div style="flex:1;">${esc(t.desc || '(sin descripción)')}${(t.project || t.phase) ? `<div class="wk-phase">${esc([t.project, t.phase].filter(Boolean).join(' · '))}</div>` : ''}</div>
        ${waiting ? `<span class="area-tag" style="background:rgba(248,113,113,0.15);color:#f87171;border:1px solid rgba(248,113,113,0.4)" title="EN ESPERA — bloqueada hasta que se cumpla su dependencia">⏳ esperando</span>` : ''}
        ${t.area ? `<span class="area-tag" style="background:${areaColor(t.area)}22;color:${areaColor(t.area)};border:1px solid ${areaColor(t.area)}55">${esc(t.area)}</span>` : ''}
      </div>`;
  }

  const cards = weeks.map(sprint => {
    const isCurrent = TODAY >= sprint.start && TODAY <= sprint.end;
    const all = tasksForWeek(sprint);
    const pending = all.filter(t => !t.done);
    const doneN = all.length - pending.length;
    const isWaiting = t => (t.status || '').toUpperCase() === 'EN ESPERA';
    const active  = pending.filter(t => !isWaiting(t));   // EN PROCESO / sin status
    const waiting = pending.filter(isWaiting);            // EN ESPERA (bloqueadas)

    // agrupar las ACTIVAS por responsable
    const byPerson = {};
    active.forEach(t => {
      const person = (t.resp || '').trim() || 'Equipo';
      (byPerson[person] = byPerson[person] || []).push(t);
    });
    const people = Object.keys(byPerson).sort((a, b) =>
      a === 'Equipo' ? 1 : b === 'Equipo' ? -1 : a.localeCompare(b, 'es'));

    let body;
    if (!pending.length) {
      body = `<div class="wk-empty">Sin tareas pendientes${doneN ? ` · ✓ ${doneN} lista${doneN !== 1 ? 's' : ''}` : ''} esta semana.</div>`;
    } else {
      const totalBar = `<div class="wk-total-bar"><span class="wk-total-badge">${active.length} activa${active.length !== 1 ? 's' : ''}${waiting.length ? ` · ⏳ ${waiting.length} esperando` : ''}${doneN ? ` · ✓ ${doneN} lista${doneN !== 1 ? 's' : ''}` : ''}</span></div>`;
      const groups = people.map(person => {
        const tl = byPerson[person];
        const gid = `wkg-${_wkGid++}`;
        const tasksHTML = tl.map(t => taskRow(t, false)).join('');
        return `<div class="wk-group">
          <div class="wk-person-header" onclick="(function(h){var b=document.getElementById('${gid}');if(!b)return;var o=b.style.display!=='none';b.style.display=o?'none':'block';h.querySelector('.wk-chevron').style.transform=o?'rotate(0deg)':'rotate(90deg)';})(this)">
            <div style="display:flex;align-items:center;"><span class="wk-chevron" style="transform:rotate(90deg)">▸</span><span class="wk-group-title" style="margin:0;">${esc(person)}</span></div>
            <span class="wk-person-count">${tl.length} activa${tl.length !== 1 ? 's' : ''}</span>
          </div>
          <div id="${gid}" style="display:block;">${tasksHTML}</div>
        </div>`;
      }).join('');
      // sección de ESPERANDO (bloqueadas por dependencia), aparte y colapsable
      let waitingHTML = '';
      if (waiting.length) {
        const gid = `wkg-${_wkGid++}`;
        waitingHTML = `<div class="wk-group">
          <div class="wk-person-header" onclick="(function(h){var b=document.getElementById('${gid}');if(!b)return;var o=b.style.display!=='none';b.style.display=o?'none':'block';h.querySelector('.wk-chevron').style.transform=o?'rotate(0deg)':'rotate(90deg)';})(this)">
            <div style="display:flex;align-items:center;"><span class="wk-chevron" style="transform:rotate(90deg)">▸</span><span class="wk-group-title" style="margin:0;color:#f87171;">⏳ Esperando (bloqueadas)</span></div>
            <span class="wk-person-count">${waiting.length}</span>
          </div>
          <div id="${gid}" style="display:block;">${waiting.map(t => taskRow(t, true)).join('')}</div>
        </div>`;
      }
      body = totalBar + groups + waitingHTML;
    }

    return `<div class="wk-card${isCurrent ? ' current' : ''}">
      <div class="wk-header">
        <span class="wk-label${isCurrent ? ' cur' : ''}">${isCurrent ? '● Semana actual · ' : ''}${fmtRange(sprint.start, sprint.end)}</span>
        <span style="font-size:10px;color:var(--text-mut);">${sprint.name}</span>
      </div>
      ${body}
    </div>`;
  }).join('');

  return `
  <section class="block" id="b-weekly">
    <div class="block-head">
      <span class="block-num">04</span><span class="block-title">Tareas por semana</span>
      <span class="block-desc">Solo pendientes · agrupadas por responsable</span>
    </div>
    <div class="wk-grid">${cards}</div>
  </section>`;
}

// ── 05 Áreas & Acuerdos ───────────────────────────────────────────────
function renderAreasAcuerdos(model) {
  // carga por área y por responsable
  const byArea = {}, byResp = {};
  model.forEach(p => {
    const all = [...p.phases.flatMap(ph => ph.tasks), ...p.sprintTasks];
    all.forEach(t => {
      if (t.area) byArea[t.area] = (byArea[t.area] || 0) + 1;
      if (t.resp) byResp[t.resp] = (byResp[t.resp] || 0) + 1;
    });
  });
  const areaMax = Math.max(1, ...Object.values(byArea));
  const respMax = Math.max(1, ...Object.values(byResp));
  const areaRows = Object.entries(byArea).sort((a,b)=>b[1]-a[1]);
  const respRows = Object.entries(byResp).sort((a,b)=>b[1]-a[1]).slice(0, 8);

  const areaPanel = areaRows.length ? `
    <div class="barlist">${areaRows.map(([a,n]) => `
      <div class="barrow">
        <div class="name"><span class="dot" style="background:${areaColor(a)}"></span>${esc(a)}</div>
        <div class="bartrack"><div class="barfill" style="width:${n/areaMax*100}%;background:${areaColor(a)}"></div></div>
        <div class="num">${n}</div>
      </div>`).join('')}</div>`
    : `<div class="scol-empty">Sin tareas con área asignada</div>`;

  const respPanel = respRows.length ? `
    <div class="barlist">${respRows.map(([r,n]) => `
      <div class="barrow">
        <div class="name">${esc(r)}</div>
        <div class="bartrack"><div class="barfill" style="width:${n/respMax*100}%;background:linear-gradient(90deg,var(--accent),var(--accent2))"></div></div>
        <div class="num">${n}</div>
      </div>`).join('')}</div>`
    : `<div class="scol-empty">Sin responsables asignados</div>`;

  // acuerdos por estado
  const ST = { COMPLETADO:{c:'var(--green)',l:'Completados'}, 'EN PROCESO':{c:'var(--yellow)',l:'En proceso'},
               PENDIENTE:{c:'var(--blue)',l:'Pendientes'}, CANCELADO:{c:'var(--red)',l:'Cancelados'} };
  const acCount = { COMPLETADO:0, 'EN PROCESO':0, PENDIENTE:0, CANCELADO:0 };
  model.forEach(p => (p.acuerdos||[]).forEach(a => (a.items||[]).forEach(it => {
    const k = (it.status||'PENDIENTE').toUpperCase();
    if (k in acCount) acCount[k]++; else acCount.PENDIENTE++;
  })));
  const acTotal = Object.values(acCount).reduce((a,b)=>a+b,0);
  const acPanel = acTotal ? `
    <div class="ac-stat">${Object.entries(ST).map(([k,v]) => `
      <div class="acbox">
        <b style="color:${v.c}">${acCount[k]}</b>
        <span><span class="dot" style="background:${v.c}"></span>${v.l}</span>
      </div>`).join('')}</div>`
    : `<div class="scol-empty">Sin acuerdos registrados todavía</div>`;

  return `
  <section class="block" id="b-areas">
    <div class="block-head">
      <span class="block-num">05</span><span class="block-title">Áreas, carga y acuerdos</span>
    </div>
    <div class="twocol">
      <div class="card panel"><div class="panel-h">Tareas por área</div>${areaPanel}</div>
      <div class="card panel"><div class="panel-h">Carga por responsable</div>${respPanel}</div>
    </div>
    <div class="card panel" style="margin-top:16px"><div class="panel-h">Estado de acuerdos</div>${acPanel}</div>
  </section>`;
}

// ── nav spy ───────────────────────────────────────────────────────────
function initNavSpy() {
  const links = [...document.querySelectorAll('.subnav a')];
  const onScroll = () => {
    const y = window.scrollY + 90;
    let active = links[0]?.getAttribute('href');
    document.querySelectorAll('.block').forEach(sec => {
      if (sec.offsetTop <= y) active = '#' + sec.id;
    });
    links.forEach(a => a.classList.toggle('active', a.getAttribute('href') === active));
  };
  window.removeEventListener('scroll', window.__navspy || (()=>{}));
  window.__navspy = onScroll;
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
}
