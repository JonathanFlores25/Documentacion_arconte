<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CV Celestial — Bitácora</title>
  <link rel="stylesheet" href="/assets/app.css" />
</head>
<body data-page="bitacora">
  <div id="app-top"></div>

  <div class="container">
<div class="section" id="sec-bitacora" style="display:none;">
      <div class="section-title">06 — Bitácora · Historial de cambios</div>
      <div id="bitacora-locked" style="font-size:12px;color:var(--text-muted);padding:10px;">
        🔒 Sección solo para administradores. Desbloquea con tu token de admin (botón 🔒 Admin arriba).
      </div>
      <div id="bitacora-body" style="display:none;">
        <div class="bitacora-toolbar">
          <input type="text" id="bitacora-search" class="bitacora-search" placeholder="Buscar (proyecto, usuario, detalle)…" oninput="renderAudit()">
          <select id="bitacora-action" class="bitacora-filter" onchange="renderAudit()">
            <option value="">Toda acción</option>
            <option value="delete">Eliminaciones</option>
            <option value="add">Agregaciones</option>
            <option value="move">Movimientos</option>
            <option value="edit">Ediciones/estados</option>
            <option value="evidence">Evidencias</option>
          </select>
          <button class="rm-tool-btn" onclick="loadAudit()" title="Recargar">🔄</button>
          <span id="bitacora-count" style="font-size:11px;color:var(--text-muted);"></span>
        </div>
        <div id="bitacora-list" class="bitacora-list">
          <div style="font-size:12px;color:var(--text-muted);padding:10px;">Cargando bitácora…</div>
        </div>
      </div>
    </div>
  </div><!-- /container -->

  <div id="app-foot"></div>

  <script src="/assets/app.js"></script>
</body>
</html>
